name: OpenSide
options:
  bundleIdPrefix: com.openside
  deploymentTarget:
    macOS: "14.0"

packages:
  OpenSideCore:
    path: ../..

targets:
  OpenSide:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ../../Sources/OpenSide
    dependencies:
      - package: OpenSideCore
        product: OpenSideCore
    info:
      path: Info.plist
      properties:
        CFBundleName: OpenSide
        CFBundleDisplayName: OpenSide
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSHumanReadableCopyright: Copyright © 2026 bldev2473. Licensed under the MIT License.
    configFiles:
      Debug: Local.xcconfig
      Release: Local.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.openside.app
        PRODUCT_NAME: OpenSide
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
